name: Refresh Instagram token

on:
  schedule:
    - cron: "0 6 * * 1"         # every Monday 6am UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Refresh and save token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python autopost.py refresh-token --out new_token.txt
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GH_PAT secret is missing, so the fresh token could not be saved. See step 6 of the setup guide."
            rm -f new_token.txt; exit 1
          fi
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < new_token.txt
          rm -f new_token.txt
          echo "Token refreshed and saved."
