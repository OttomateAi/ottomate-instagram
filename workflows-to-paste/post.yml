name: Post to Instagram

on:
  schedule:
    - cron: "*/15 * * * *"      # checks every 15 minutes
  push:
    paths: ["content/**"]       # checks a new batch for mistakes when you upload it
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        type: choice
        default: whoami
        options: [whoami, upcoming, dry-run, run, check]

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run autoposter
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "${{ github.event_name }}" = "push" ]; then MODE=check; fi
          if [ -z "$MODE" ]; then MODE=run; fi
          python autopost.py "$MODE"
      - name: Save posting log
        if: always()
        run: |
          git config user.name "ottomate-bot"
          git config user.email "ottomate-bot@users.noreply.github.com"
          git add state/posted.json
          if ! git diff --cached --quiet; then
            git commit -m "Posting log update"
            git pull --rebase
            git push
          fi
